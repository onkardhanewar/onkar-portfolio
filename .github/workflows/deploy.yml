name: Deploy Portfolio

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install
        working-directory: ./artifacts/onkar-portfolio

      - name: Build Portfolio
        run: npm run build
        working-directory: ./artifacts/onkar-portfolio
        env:
          BASE_PATH: /onkar-portfolio/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload dist
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./artifacts/onkar-portfolio/dist/public

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4